# 0. ROS2 参数配置
serial_controller:
  ros__parameters:
    port: "/dev/stm32"
    baudrate: 115200
    timeout: 0.1

# 1. 全局配置
config:
  baudrate: 115200
  buffer_size: 1024
  head_byte_1: 0x5A      # 双帧头 1
  head_byte_2: 0xA5      # 双帧头 2
  checksum: "CRC8"              # 校验算法, 可选: NONE, SUM8, XOR8, CRC8
  require_handshake: true       # false = 跳过握手, 上电直接进入 RUNNING, 握手内容为配置文件hash
  ignore_version_mismatch: true # true = hash 不一致时也允许进入 RUNNING
  enable_heartbeat: true        # false = 不发送 Heartbeat, 也不做 ACK 断连检测
  strict_heartbeat: true        # true = 超时直接断连, false = 仅 WARN 不断连
  reliable_retry_interval_ms: 100
  reliable_max_retries: 3
  qos_depth: 10
  heartbeat_timeout_ms: 3000    # (0 = 不检测)

# 2. 类型映射
type_mappings:
  f32: "float"
  i32: "int32_t"
  u8:  "uint8_t"
  u16: "uint16_t"
  u32: "uint32_t"

messages:

  # ============================================================
  # 系统消息 (必需, 请勿删除或修改 ID)
  # ============================================================
  - name: "Ack"
    id: 0xFD
    direction: "both"
    debug_log_mode: "on_change"
    sub_topic: "/task/ack"
    pub_topic: "/task/ack"
    ros_msg: "std_msgs/msg/Int32MultiArray"
    notes: "通用 ACK。acked_id 为被确认包的原始 Packet ID，ack_seq 为发送方附加的序列号，用于区分同 ID 的不同版本。"
    fields:
      - { proto: "acked_id", type: "u8", ros: "data[0]" }
      - { proto: "ack_seq",  type: "u8", ros: "data[1]" }

  - name: "Heartbeat"
    id: 0xFE
    direction: "both"
    debug_log_mode: "on_change"
    sub_topic: "/task/heartbeat"
    pub_topic: "/task/heartbeat"
    ros_msg: "std_msgs/msg/UInt32"
    notes: "握手完成后，ROS 侧以固定周期下发心跳。电控收到后必须尽快原样回同一个 count 作为确认。"
    fields:
      - { proto: "count", type: "u32", ros: "data" }

  - name: "Handshake"
    id: 0xFF
    direction: "both"
    debug_log_mode: "on_change"
    sub_topic: "/task/handshake"
    pub_topic: "/task/handshake"
    ros_msg: "std_msgs/msg/UInt32"
    notes: "上电后 ROS 主动发起握手，电控收到后用相同的 protocol_hash 原样回复。"
    fields:
      - { proto: "protocol_hash", type: "u32", ros: "data" }

  # ============================================================
  # 自定义业务消息
  # ============================================================
  # qiyucolor1 → area_flag1: 0=无, 1=黄色, 2=紫色
  - name: "AreaFlag1"
    id: 0x01
    direction: "tx"
    debug_log_mode: "on_change"
    sub_topic: "area_flag1"
    ros_msg: "std_msgs/msg/Int32"
    notes: "qiyucolor1 节点发布。0=无, 1=黄色, 2=紫色"
    fields:
      - { proto: "flag1", type: "i32", ros: "data" }

  # qiyucolor2 → area_flag2: 0/1 flag
  - name: "AreaFlag2"
    id: 0x02
    direction: "tx"
    debug_log_mode: "on_change"
    sub_topic: "area_flag2"
    ros_msg: "std_msgs/msg/Int32"
    notes: "qiyucolor2 节点发布。0/1 flag"
    fields:
      - { proto: "flag2", type: "i32", ros: "data" }

  # res_kfs → /flag: 0/1 flag
  - name: "Flag"
    id: 0x03
    direction: "tx"
    debug_log_mode: "on_change"
    sub_topic: "/flag"
    ros_msg: "std_msgs/msg/Int32"
    notes: "res_kfs 节点发布。0/1 flag"
    fields:
      - { proto: "flag", type: "i32", ros: "data" }

  # yolo → camera/yolo/point: 3D 坐标点
  - name: "YoloPoint"
    id: 0x04
    direction: "tx"
    debug_log_mode: "on_change"
    sub_topic: "camera/yolo/point"
    ros_msg: "geometry_msgs/msg/PointStamped"
    notes: "yolo 节点发布。3D 坐标点"
    fields:
      - { proto: "x", type: "f32", ros: "point.x" }
      - { proto: "y", type: "f32", ros: "point.y" }
      - { proto: "z", type: "f32", ros: "point.z" }
